[package]
name = "tyrano-cli"
version = "0.1.2"
edition = "2024"

[[bin]]
name = "tyrano-cli"
path = "src/main.rs"

[dependencies]
tyrano-syntax = { path = "../tyrano-syntax" }
tyrano-analysis = { path = "../tyrano-analysis" }
tyrano-js-analysis = { path = "../tyrano-js-analysis" }
tyrano-project = { path = "../tyrano-project" }
tyrano-semantic = { path = "../tyrano-semantic" }
clap = { version = "4", features = ["derive"] }
